name: caudal
description: "Descarga musica y videos desde su propio navegador"
publish_to: 'none'
version: 2.7.5+3050

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # red y descargas
  dio: ^5.7.0

  # navegador propio: hace falta uno que deje ver pasar cada peticion de la
  # pagina, leer sus cookies de sesion y atender las descargas que dispare.
  # El webview_flutter de siempre no ofrece nada de eso.
  # almacenamiento y permisos
  path_provider: ^2.1.5
  permission_handler: ^12.0.0
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  path: ^1.9.0

  # reproduccion
  # utilidades de interfaz
  cached_network_image: ^3.4.1
  open_filex: ^4.7.0
  share_plus: ^12.0.0
  gal: ^3.0.1
  youtube_explode_dart: ^3.1.0
  ffmpeg_kit_flutter_new: ^4.6.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  audio_service: ^0.18.19
  http: ^1.6.0
  http_parser: ^4.1.2
  url_launcher: ^6.3.1
  crypto: ^3.0.6
  flutter_inappwebview: ^6.1.5
  connectivity_plus: ^7.3.1
  audio_session: ^0.2.4
  file_picker: ^11.0.3
  web_socket_channel: ^3.0.3
  sqflite_common_ffi_web: ^1.2.2
  web: ^1.1.2
  image: ^4.13.1
  # la copia de seguridad (.caudal) es un zip: el mismo que escribe Caudal Escritorio
  archive: ^4.0.7
  # enviar la musica a Chromecast y altavoces/teles con Google Cast (SDK nativo
  # de Google en Android e iPhone; la 2.x pide permission_handler 13)
  flutter_chrome_cast: ^1.4.8
  # «¿Qué suena?»: grabar unos segundos del micrófono para reconocer la canción
  record: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/legal/
    - assets/logo/
    - assets/mascotas/
    - assets/fondos/
    - assets/escenarios/
    - assets/donar/
    - assets/sonidos/
    # el sonido suave del despertador (si no hay musica ni internet al sonar)
    - assets/despertador/

  # tipografías para la letra de las canciones (Ajustes › Letra; licencia OFL en assets/fuentes/OFL.txt)
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fuentes/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fuentes/Poppins-ExtraBold.ttf
          weight: 800
    - family: BebasNeue
      fonts:
        - asset: assets/fuentes/BebasNeue-Regular.ttf
    - family: Anton
      fonts:
        - asset: assets/fuentes/Anton-Regular.ttf
    - family: Righteous
      fonts:
        - asset: assets/fuentes/Righteous-Regular.ttf
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fuentes/DMSerifDisplay-Regular.ttf
    - family: Pacifico
      fonts:
        - asset: assets/fuentes/Pacifico-Regular.ttf
    - family: Lobster
      fonts:
        - asset: assets/fuentes/Lobster-Regular.ttf
    - family: Bangers
      fonts:
        - asset: assets/fuentes/Bangers-Regular.ttf
