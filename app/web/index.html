<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="theme-color" content="#06070A">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Caudal en el navegador: tu música, tus listas, letras traducidas y chat con amigos, con tu misma cuenta.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Caudal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Caudal — Tu música en el navegador</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; background: #06070A; }
    #carga { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: radial-gradient(60% 50% at 50% 40%, #0f2a3a 0%, #06070A 70%); font-family: system-ui, sans-serif;
      color: #A9B1C0; transition: opacity .35s ease; z-index: 9; }
    #carga img { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 18px 50px rgba(34,211,238,.35);
      animation: latir 1.6s ease-in-out infinite; }
    #carga b { color: #F3F5F9; font-size: 26px; letter-spacing: -.5px; }
    #carga .barra { width: 140px; height: 3px; border-radius: 3px; background: #1B1F27; overflow: hidden; }
    #carga .barra i { display: block; width: 40%; height: 100%; background: #22D3EE; border-radius: 3px; animation: correr 1.1s ease-in-out infinite; }
    @keyframes latir { 50% { transform: scale(1.06); } }
    @keyframes correr { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #carga img, #carga .barra i { animation: none; } }
  </style>
</head>
<body>
  <div id="carga"><img src="icons/Icon-192.png" alt=""><b>Caudal</b><div class="barra"><i></i></div><span>Cargando tu música…</span></div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      const c = document.getElementById('carga');
      if (c) { c.style.opacity = '0'; setTimeout(() => c.remove(), 400); }
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
